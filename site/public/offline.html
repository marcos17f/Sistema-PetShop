<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sem internet</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8f5ef;
           color: #14213d; font-family: system-ui, sans-serif; padding: 20px; box-sizing: border-box; }
    main { background: #fff; border-radius: 22px; padding: 32px; max-width: 420px; text-align: center; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 0 0 20px; color: #4a5570; line-height: 1.5; }
    button { font: inherit; font-weight: 700; border: 0; border-radius: 14px; padding: 12px 20px; background: #25488a; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Sem conexão com a internet</h1>
    <p>O sistema precisa de internet para mostrar a agenda e os clientes com segurança. Confira o Wi-Fi e tente de novo.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
