spring:
  application:
    name: petshop-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/petshop}
    username: ${DB_USER:petshop}
    password: ${DB_PASSWORD:petshop}
  flyway:
    # db/postgresql: só no PostgreSQL (ex.: trava que impede apagar o histórico de alterações)
    locations: classpath:db/migration,classpath:db/{vendor}
  jpa:
    hibernate:
      ddl-auto: none   # o schema é do Flyway
    open-in-view: false
  jackson:
    time-zone: America/Sao_Paulo   # Goiânia (GO)

server:
  port: ${PORT:8080}
  # Atrás do proxy da hospedagem: o IP do cliente (limites de login/agendamento) vem do X-Forwarded-For, mas só quando
  # quem repassa é um proxy de rede interna; de fora, o cabeçalho é ignorado (não dá para falsificar o IP).
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health      # nada além da saúde fica exposto
  endpoint:
    health:
      show-details: never    # responde só {"status":"UP"}, sem detalhes internos

app:
  cors:
    origens: ${CORS_ORIGENS:http://localhost:3000}
  painel:
    # Login do painel da loja. Em produção, use {bcrypt}<hash> no lugar de {noop}.
    usuario: ${PAINEL_USUARIO:loja}
    senha: ${PAINEL_SENHA:{noop}troque-esta-senha}
    loja-slug: ${PAINEL_LOJA:petshop-cleiton}
  lembrete:
    cron: "0 0 18 * * *"
  # Endereço público do site (vai no link da resposta rápida e das mensagens)
  site-url: ${SITE_URL:http://localhost:3001}
  campanhas:
    # A Meta limita números novos a ~250 conversas iniciadas pela empresa por dia; o resto continua no dia seguinte
    limite-dia: ${CAMPANHAS_LIMITE_DIA:200}
  limites:
    # Avisos do sistema (tela Saúde do sistema): quando chegar perto destes limites, o painel avisa
    whatsapp-mensagens-mes: ${LIMITE_WHATSAPP_MES:1000}   # franquia/plano de mensagens enviadas por mês
    banco-mb: ${LIMITE_BANCO_MB:1000}                     # espaço do banco contratado na hospedagem
  whatsapp:
    # WhatsApp Cloud API OFICIAL (Meta). Sem token e phone-number-id, o sistema fica no modo SIMULADO:
    # nada sai, e a tela WhatsApp do painel mostra cada mensagem com botão para mandar por clique.
    # O token é segredo: só em variável de ambiente, nunca no banco, na tela ou no Git.
    token: ${WHATSAPP_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    api-url: ${WHATSAPP_API_URL:https://graph.facebook.com/v23.0}
    template-lembrete: ${WHATSAPP_TEMPLATE_LEMBRETE:lembrete_pet}
    template-confirmacao: ${WHATSAPP_TEMPLATE_CONFIRMACAO:confirmacao_agendamento}
    template-avaliacao: ${WHATSAPP_TEMPLATE_AVALIACAO:avaliacao_atendimento}
    # Webhook (mensagens recebidas): segredo do app na Meta (confere a assinatura) e token de verificação
    app-secret: ${WHATSAPP_APP_SECRET:}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
