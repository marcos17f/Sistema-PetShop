# Substitui o application.yml principal nos testes: H2 em memória no modo PostgreSQL.
spring:
  datasource:
    url: jdbc:h2:mem:petshop;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

app:
  cors:
    origens: http://localhost:3000
  painel:
    usuario: loja
    senha: "{noop}senha-teste"
    loja-slug: petshop-cleiton
  lembrete:
    cron: "-"
  whatsapp:
    token: ""
    phone-number-id: ""
    limpeza-cron: "-"
